<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic System | Actor Registration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.4s ease-out;
            border-top: 5px solid #3498db;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            font-size: 1.5rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; 
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }

        #password-strength {
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: bold;
            min-height: 1.2rem;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover { background-color: #2980b9; }

        .btn-back {
            text-align: center;
            text-decoration: none;
            color: #7f8c8d;
            font-size: 0.9rem;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-back:hover { color: #2c3e50; background-color: #f1f2f6; }
    </style>
</head>
<body>

<div class="card">
    <h2>Actor Registration</h2>
    
    <form action="UserServlet" method="POST" id="registrationForm" onsubmit="return validateSubmission()">
        <input type="hidden" name="action" value="add">
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <div id="password-strength"></div>
        </div>

        <div class="form-group">
            <label for="role">System Role</label>
            <select id="role" name="role" required>
                <option value="" disabled selected>Select an actor role</option>
                <option value="Admin">Administrator</option>
                <option value="Doctor">Doctor</option>
                <option value="Receptionist">Receptionist</option>
                <option value="Lab_technician">Lab Technician</option>
                <option value="Pharmacist">Pharmacist</option>
            </select>
        </div>

        <div class="btn-container">
            <button type="submit">Create Account</button> 
            <a href="admin_dashboard.jsp" class="btn-back">← Back to Dashboard</a>
        </div>
    </form>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const strengthDisplay = document.getElementById('password-strength');

    passwordInput.addEventListener('input', function() {
        const val = passwordInput.value;
        const hasLetter = /[a-zA-Z]/.test(val);
        const hasNumber = /[0-9]/.test(val);

        if (val.length === 0) strengthDisplay.innerText = '';
        else if (val.length < 8) {
            strengthDisplay.innerText = '❌ Too short (Min 8)';
            strengthDisplay.style.color = '#e74c3c';
        } else if (!hasLetter || !hasNumber) {
            strengthDisplay.innerText = '⚠️ Add letters & numbers';
            strengthDisplay.style.color = '#f39c12';
        } else {
            strengthDisplay.innerText = '✅ Strong Password';
            strengthDisplay.style.color = '#27ae60';
        }
    });

    function validateSubmission() {
        const val = passwordInput.value;
        const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
        if (!regex.test(val)) {
            alert("Password must be 8+ characters with letters and numbers.");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
